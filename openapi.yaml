openapi: 3.0.3

info:
  title: Product Service API
  version: 1.0.0
  description: API for managing products and their variants.

servers:
  - url: http://localhost:8080
    description: Local development server

paths:

  /products:
    get:
      operationId: listProducts
      summary: List Products
      parameters:
        - name: page
          in: query
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of products per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Filter products by status.
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: search
          in: query
          description: Search products by name.
          schema:
            type: string
      responses:
        '200':
          description: Products retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'

      responses:
        '201':
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'


  /products/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        description: Unique product identifier.
        schema:
          $ref: '#/components/schemas/ID'
    get:
      operationId: getProduct
      summary: Get a product
      responses:
        '200':
          description: Product retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '404':
          $ref: '#/components/responses/NotFound'

components:

  schemas:

    ID:
      type: string
      format: uuid

    Timestamp:
      type: string
      format: date-time
      example: '2026-11-05T08:00:00Z'

    ProductStatus:
      type: string
      enum:
        - draft
        - published
        - archived

    VariantStatus:
      type: string
      enum:
        - active
        - inactive

    CreateProductRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/CreateProductVariantRequest'

    CreateProductVariantRequest:
      type: object
      required:
        - name
        - sku
        - price
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        sku:
          type: string
          minLength: 1
          maxLength: 100
        price:
          type: number
          format: double
          minimum: 0

    ProductListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Product:
      type: object
      required:
        - id
        - name
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    ProductVariant:
      type: object
      required:
        - id
        - name
        - sku
        - price
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        sku:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        status:
          $ref: '#/components/schemas/VariantStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'


    Pagination:
      type: object
      required:
        - page
        - limit
        - total_items
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          example: 20
        total_items:
          type: integer
          minimum: 0
          example: 45
        total_pages:
          type: integer
          minimum: 0
          example: 3

    Error:
      type: object
      required:
        - error
      properties:
          error:
            type: string
            example: Product not found

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
